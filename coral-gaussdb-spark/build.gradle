apply plugin: 'java-library'

dependencies {
  api project(path: ':coral-gaussdb')
  api project(path: ':coral-spark')
  implementation project(path: ':coral-common')
  implementation project(path: ':coral-hive')
  // Calcite is supplied transitively as the shaded variant via coral-common.
  // Do NOT re-declare linkedin-calcite-core here — see coral-gaussdb/build.gradle
  // for the dual-variant NoSuchFieldError rationale.

  testImplementation deps.'testing'
  testImplementation(deps.'hive'.'hive-exec-core') {
    exclude group: 'org.apache.avro', module: 'avro-tools'
    exclude group: 'org.apache.calcite', module: 'calcite-core'
    exclude group: 'org.apache.calcite', module: 'calcite-avatica'
  }
  testImplementation deps.'hadoop'.'hadoop-mapreduce-client-common'
}

// Ad-hoc smoke runner: `./gradlew :coral-gaussdb-spark:smoke` translates a
// handful of representative GaussDB statements to Spark SQL and prints the
// results. Lives in src/test so it has the LocalMetastore fixture on the
// classpath without polluting the published jar.
task smoke(type: JavaExec) {
  group = 'verification'
  description = 'Translate sample GaussDB SQL to Spark SQL and print to stdout.'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.linkedin.coral.gaussdb.spark.SmokeDemo'
  standardOutput = System.out
  errorOutput = System.err
}
