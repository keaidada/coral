apply plugin: 'antlr'
apply plugin: 'java-library'

dependencies {
  // ANTLR4 grammar generator (compile-time only). Runs the tool, does not
  // leak the tool jar into the runtime classpath.
  antlr deps.'antlr4'

  // ANTLR4 runtime. Coexists with ANTLR 3.x used by coral-hive/coral-pig —
  // different packages (org.antlr.v4.runtime vs org.antlr.runtime).
  api deps.'antlr4-runtime'

  api project(path: ':coral-common')
  // Reuse Hive's validator, convertlet table, and Dali operator table.
  // Mirrors the coral-trino approach.
  api project(path: ':coral-hive')

  // Calcite comes transitively via coral-common as the shaded variant.
  // Do NOT re-declare linkedin-calcite-core here — a second (non-shaded)
  // variant on the classpath produces split-classloader NoSuchFieldError
  // at runtime (observed: Programs.RULE_SET resolves into the wrong copy).

  testImplementation deps.'testing'
  testImplementation(deps.'hive'.'hive-exec-core') {
    exclude group: 'org.apache.avro', module: 'avro-tools'
    // Prevent Apache Calcite (bundled in hive-exec) from shadowing the
    // LinkedIn custom Calcite build at test runtime — same defense used in
    // coral-hive and coral-trino test configs.
    exclude group: 'org.apache.calcite', module: 'calcite-core'
    exclude group: 'org.apache.calcite', module: 'calcite-avatica'
  }
  testImplementation deps.'hadoop'.'hadoop-mapreduce-client-common'
  testImplementation deps.'kryo'
}

// Generate ANTLR4 sources under the intended Java package. The gradle antlr
// plugin does not read `-package` to decide an output subdir, so we must point
// outputDirectory at the package-matching subdirectory ourselves. Otherwise
// the lexer/parser end up in the default package and our `-package` directive
// in the .g4 places them in com.linkedin.coral.gaussdb.parser — mismatch!
generateGrammarSource {
  arguments += [
    '-visitor',
    '-no-listener',
    '-package', 'com.linkedin.coral.gaussdb.parser',
    '-long-messages'
  ]
  outputDirectory = file("${buildDir}/generated-src/antlr/main/com/linkedin/coral/gaussdb/parser")
}

// Gradle 8 strict validation: spotless must run after ANTLR generates sources.
tasks.named('spotlessJava').configure { mustRunAfter('generateGrammarSource') }
