[package]
name = "coral-hive-catalog"
description = "Hive Metastore Catalog implementation for coral-core (HTTP / REST transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "coral_hive_catalog"
path = "src/lib.rs"

[dependencies]
coral-core = { path = "../core", version = "0.1.0" }
# Use a minimal blocking HTTP client — ureq is pure-Rust, ~50 KB, no tokio.
# For projects that already use tokio, swap in reqwest via a custom Transport.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
