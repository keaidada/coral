#
# cargo-fuzz config for coral-core. Run with nightly:
#
#     cargo +nightly fuzz run translate
#
# The fuzz crate is intentionally NOT a workspace member — cargo-fuzz needs
# its own nightly-only manifest.

[package]
name = "coral-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
coral-core = { path = "../core" }

# Intentionally not in the workspace to keep cargo-fuzz's nightly-only
# requirements out of the main workspace build.
[workspace]
members = ["."]

[[bin]]
name = "translate"
path = "fuzz_targets/translate.rs"
test = false
doc = false
bench = false
